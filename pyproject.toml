[project]
name = "topic-modeling-streamlit"
version = "0.1.2"
description = ""
authors = [{ name = "Bor Hodošček", email = "dev@bor.space" }]
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.8.1",
    "altair>=5.5.0",
    "bertopic>=0.17.3,<1",
    "boto3>=1.39.13",
    "datamapplot>=0.6.3",
    "einops>=0.8.1",
    "en-core-web-sm",
    "en-core-web-trf",
    "filelock>=3.18.0",
    "fugashi-plus>=1.4.0.post1",
    "gensim>=4.4.0,<5",
    "ipython>=9.4.0",
    "ja-core-news-sm",
    "jaconv>=0.4.0",
    "litellm>=1.74.7",
    "matplotlib>=3.10.3",
    "numpy>=1.26.4",
    "pandas>=2.3.1",
    "plotly>=6.2.0,<7",
    "polars>=1.31.0",
    "pyarrow>=20.0.0",
    "pyldavis>=3.4.1",
    "pysbd>=0.3.4",
    "regex>=2024.11.6",
    "rhoknp>=1.7.1",
    "safetensors>=0.5.3",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.1.0,<7",
    "sentencepiece>=0.2.0",
    "spacy>=3.8.7",
    "stqdm>=0.0.5",
    "streamlit>=1.46.1",
    "sudachidict-full>=20250515",
    "sudachipy>=0.6.10",
    "tenacity>=9.1.2",
    "tiktoken>=0.9.0",
    "torch>=2.7.1",
    "torchdr>=0.3,<1",
    "transformers>=4.55.0,<5",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "unidic-lite>=1.0.8",
    "xxhash>=3.5.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cuda = [
    "bitsandbytes>=0.46.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch>=2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
rocm = [
    "torch>=2.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm>=3.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
mlx = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "types-tqdm>=4.67.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topic_modeling_streamlit"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src"]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL"

[tool.uv]
exclude-newer = "P3D"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
conflicts = [[
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "rocm" },
    { extra = "mlx" },
]]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
ja-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ja_core_news_sm-3.8.0/ja_core_news_sm-3.8.0-py3-none-any.whl" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-rocm72", extra = "rocm" },
]
triton-rocm = { index = "pytorch-rocm72", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
